name: Update Claude Agent SDK

on:
  schedule:
    # Run daily at 8am UTC (offset from opencode update at 7am)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check for GitHub App secrets
        id: check-secrets
        run: |
          if [ -z "$APP_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "GitHub App secrets not configured, using default token"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}

      - name: Create GitHub App token
        if: steps.check-secrets.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Get current version
        id: current
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('container/agent-runner/package.json').read_text())
          version = package.get('dependencies', {}).get('@anthropic-ai/claude-agent-sdk', '')
          print(version.lstrip('^') if version else '')
          PY
          )
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current: $VERSION"

      - name: Get latest version
        id: latest
        run: |
          VERSION=$(curl -fsSL https://registry.npmjs.org/@anthropic-ai/claude-agent-sdk/latest | jq -r '.version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest: $VERSION"

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" != "${{ steps.latest.outputs.version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing PR
        id: existing_pr
        if: steps.check.outputs.changed == 'true'
        run: |
          PR=$(gh pr list --repo omniaura/omniclaw --base main --head update/claude-sdk-${{ steps.latest.outputs.version }} --json number --jq '.[0].number // ""')
          echo "pr=$PR" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Apply update
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.pr == ''
        run: |
          sed -i "s|\"@anthropic-ai/claude-agent-sdk\": \"\\^${{ steps.current.outputs.version }}\"|\"@anthropic-ai/claude-agent-sdk\": \"^${{ steps.latest.outputs.version }}\"|" container/agent-runner/package.json
          cd container/agent-runner
          bun update @anthropic-ai/claude-agent-sdk
          cd ../..

      - name: Commit and open PR
        id: create_pr
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.pr == ''
        run: |
          BRANCH="update/claude-sdk-${{ steps.latest.outputs.version }}"
          TITLE="chore(container): bump claude-agent-sdk to ${{ steps.latest.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add container/agent-runner/package.json container/agent-runner/bun.lock
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT
          printf '## Claude Agent SDK update\n\n' > "$BODY_FILE"
          printf -- '- **SDK**: `%s` → `%s` (`@anthropic-ai/claude-agent-sdk`)\n' "${{ steps.current.outputs.version }}" "${{ steps.latest.outputs.version }}" >> "$BODY_FILE"
          printf '\nMerging will not auto-rebuild the container — run `just update-container` after merge.\n' >> "$BODY_FILE"

          gh pr create \
            --repo omniaura/omniclaw \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Enable auto-merge
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.pr == ''
        run: |
          BRANCH="update/claude-sdk-${{ steps.latest.outputs.version }}"
          PR=$(gh pr list --repo omniaura/omniclaw --base main --head "$BRANCH" --json number --jq '.[0].number // ""')
          enable_auto_merge() {
            local pr="$1"
            local err_file
            err_file=$(mktemp)
            if gh pr merge "$pr" --repo omniaura/omniclaw --auto --squash 2>"$err_file"; then
              echo "Auto-merge enabled for PR #$pr"
            elif grep -Eiq 'auto-merge.*(not enabled|not allowed|disabled)|Pull request Auto merge is not allowed' "$err_file"; then
              echo "::warning::Could not enable auto-merge for PR #$pr (is auto-merge enabled in repo settings?)"
              cat "$err_file"
            else
              echo "::error::Failed to enable auto-merge for PR #$pr"
              cat "$err_file" >&2
              rm -f "$err_file"
              return 1
            fi
            rm -f "$err_file"
          }

          if [ -n "$PR" ]; then
            enable_auto_merge "$PR"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Ensure CI is queued for update PR
        if: steps.check.outputs.changed == 'true' && steps.existing_pr.outputs.pr == ''
        run: |
          BRANCH="${{ steps.create_pr.outputs.branch }}"
          HEAD_SHA="${{ steps.create_pr.outputs.head_sha }}"
          sleep 15

          EXISTING_RUN=$(gh run list \
            --repo omniaura/omniclaw \
            --workflow ci.yml \
            --branch "$BRANCH" \
            --json headSha,event,status \
            --jq 'map(select(.headSha == "'"$HEAD_SHA"'" and (.event == "pull_request" or .event == "workflow_dispatch" or .event == "pull_request_target"))) | length')

          if [ "$EXISTING_RUN" -eq 0 ]; then
            echo "No CI run detected for $BRANCH@$HEAD_SHA; dispatching workflow manually"
            gh workflow run ci.yml \
              --repo omniaura/omniclaw \
              --ref "$BRANCH"
          else
            echo "CI already queued for $BRANCH@$HEAD_SHA"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}
