name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Check formatting
        id: fmt-check
        run: bun run format:check
        continue-on-error: true
      - name: Auto-fix formatting
        if: steps.fmt-check.outcome == 'failure'
        run: |
          bun run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: auto-format with prettier"
          git push
      - name: Fail if formatting was wrong
        if: steps.fmt-check.outcome == 'failure'
        run: |
          echo "::notice::Formatting was auto-fixed and pushed. A new CI run will start."
          exit 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: cd container/agent-runner && bun install
      - run: bun run build
      - run: bun test
